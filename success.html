<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Successful — Prompt Helper</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 2rem; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0f; color: #f0f0f5; }
    .card { max-width: 440px; text-align: center; padding: 2.5rem; background: #12121a; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
    .icon { font-size: 64px; margin-bottom: 1rem; color: #30D158; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; font-weight: 700; }
    p { margin: 0 0 1.5rem; color: #8888a0; line-height: 1.5; }
    a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #BF5AF2; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Payment successful</h1>
    <p>Your subscription is activating. Click below to return and start using Pro.</p>
    <a class="btn" id="return-link" href="/generate.html">Return to Generator</a>
    <p id="sync-status" style="margin-top:1rem;font-size:.85rem;color:#8888a0"></p>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const sessionId = params.get('session_id');
      const status = document.getElementById('sync-status');
      if (sessionId) {
        status.textContent = 'Syncing subscription...';
        fetch('https://api-clyep56cdq-uc.a.run.app/sync-subscription?session_id=' + encodeURIComponent(sessionId))
          .then(r => r.json()).then(() => { status.textContent = 'Subscription synced. You can return now.'; })
          .catch(() => { status.textContent = 'Sync will complete shortly. You can return now.'; });
      }
    })();
  </script>
</body>
</html>
